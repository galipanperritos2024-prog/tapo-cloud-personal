# Single origin for everything the browser needs:
#   /          static UI
#   /api/      backend REST API
#   /webrtc/   MediaMTX WHEP signalling (media itself flows over UDP 8189)
#   /hls/      MediaMTX LL-HLS fallback
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_buffering off;          # stream video files / long uploads status
        proxy_read_timeout 120s;
    }

    # The MediaMTX auth hook is for MediaMTX only, never for browsers.
    location /internal/ { return 404; }

    location /webrtc/ {
        proxy_pass http://streaming:8889/;
    }

    location /hls/ {
        proxy_pass http://streaming:8888/;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /404.html;
    }
}
